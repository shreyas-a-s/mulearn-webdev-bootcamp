<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Blackjack Game</title>
	<link href="./assets/css/bootstrap.min.css" rel="stylesheet">
	<style>
		/* Light Mode */
		@media (prefers-color-scheme: light) {
			:root {
				--bs-body-bg: white;
				--bs-body-color: black;
			}
		}

		/* Dark Mode */
		@media (prefers-color-scheme: dark) {
			:root {
				--bs-body-bg: #121212;
				--bs-body-color: white;
			}
		}
	</style>
</head>

<body class="text-center">
	<div class="container mt-5">
		<h1 class="mb-4">Blackjack</h1>
		<div class="mb-3">
			<button id="startGame" class="btn btn-success">Start Game</button>
			<button id="hit" class="btn btn-primary" disabled>Hit</button>
			<button id="stand" class="btn btn-warning" disabled>Stand</button>
		</div>
		<div>
			<h3>Player's Hand: <span id="player-hand"></span> (<span id="player-score">0</span>)</h3>
			<h3>Dealer's Hand: <span id="dealer-hand"></span> (<span id="dealer-score">0</span>)</h3>
		</div>
		<h2 id="result" class="mt-3"></h2>
	</div>

	<script src="./assets/js/jquery-3.7.1.min.js"></script>
	<script src="./assets/js/script.js"></script>
</body>

</html>
